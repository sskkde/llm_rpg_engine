# =============================================================================
# LLM RPG Engine - Production Docker Compose
# =============================================================================
#
# Post-deployment steps:
# 1. cp .env.production.example .env.production && edit secrets
# 2. docker compose -f docker-compose.prod.yml up -d postgres redis
# 3. docker compose -f docker-compose.prod.yml run --rm backend alembic upgrade head
# 4. docker compose -f docker-compose.prod.yml run --rm backend python -m llm_rpg.scripts.seed_content
# 5. docker compose -f docker-compose.prod.yml up -d
#
# =============================================================================

services:
  # ===========================================================================
  # PostgreSQL with pgvector extension
  # ===========================================================================
  postgres:
    image: ankane/pgvector:latest
    container_name: llm_rpg_postgres_prod
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-llm_rpg}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-llm_rpg}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - app-network

  # ===========================================================================
  # Redis for caching and rate limiting
  # ===========================================================================
  redis:
    image: redis:7-alpine
    container_name: llm_rpg_redis_prod
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - app-network

  # ===========================================================================
  # Backend FastAPI application
  # ===========================================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: llm_rpg_backend_prod
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - APP_ENV=production
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-llm_rpg}
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=${SECRET_KEY:?SECRET_KEY is required}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-}
      - CORS_ORIGINS=${CORS_ORIGINS:-}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - ADMIN_TOKEN=${ADMIN_TOKEN:-}
      - ASSET_PROVIDER=${ASSET_PROVIDER:-openai}
      - ASSET_OPENAI_FAKE_FALLBACK=${ASSET_OPENAI_FAKE_FALLBACK:-false}
      - ASSET_RATE_LIMIT_USER_PER_DAY=${ASSET_RATE_LIMIT_USER_PER_DAY:-50}
      - ENABLE_STREAMING=${ENABLE_STREAMING:-true}
      - ENABLE_COMBAT=${ENABLE_COMBAT:-true}
    # Port 8000 internal only - nginx handles public traffic
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    networks:
      - app-network

  # ===========================================================================
  # Frontend Next.js application
  # ===========================================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: llm_rpg_frontend_prod
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      - NODE_ENV=production
      - BACKEND_API_URL=http://backend:8000
      - NEXT_PUBLIC_API_URL=
      - PORT=3005
    # Port 3005 internal only - nginx handles public traffic
    expose:
      - "3005"
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3005/', (r) => process.exit(r.statusCode === 200 ? 0 : 1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      - app-network

  # ===========================================================================
  # Nginx reverse proxy
  # ===========================================================================
  nginx:
    image: nginx:alpine
    container_name: llm_rpg_nginx_prod
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # Nginx configuration
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./deploy/nginx/ssl-params.conf:/etc/nginx/ssl-params.conf:ro
      # Site configuration (mount sites-available as sites-enabled)
      - ./deploy/nginx/sites-available:/etc/nginx/sites-enabled:ro
      # SSL certificates (mount your certs here)
      - ./deploy/nginx/ssl:/etc/nginx/ssl:ro
      # Logs
      - nginx_logs:/var/log/nginx
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - app-network

# =============================================================================
# Networks
# =============================================================================
networks:
  app-network:
    driver: bridge

# =============================================================================
# Volumes
# =============================================================================
volumes:
  postgres_data:
    name: llm_rpg_postgres_data_prod
  redis_data:
    name: llm_rpg_redis_data_prod
  nginx_logs:
    name: llm_rpg_nginx_logs_prod
